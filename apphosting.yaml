runConfig:
  minInstances: 1
  maxInstances: 1
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: FIRESTORE_DATABASE_ID
    secret: FIRESTORE_DATABASE_ID
    availability:
      - RUNTIME

  - variable: CORS_ORIGINS
    secret: CORS_ORIGINS
    availability:
      - RUNTIME

  - variable: ADMIN_EMAILS
    secret: ADMIN_EMAILS
    availability:
      - RUNTIME

  # Publishable key (reaches the browser). Swap to the live key before real payments.
  - variable: PAYMENT_KEY_ID
    value: "rzp_test_TUmxr2bTulNHjs"
    availability:
      - RUNTIME

  - variable: PAYMENT_KEY_SECRET
    secret: PAYMENT_KEY_SECRET
    availability:
      - RUNTIME

  - variable: STORAGE_BUCKET
    secret: STORAGE_BUCKET
    availability:
      - RUNTIME

  - variable: QR_SECRET
    secret: QR_SECRET
    availability:
      - RUNTIME

  - variable: VITE_FIREBASE_API_KEY
    secret: VITE_FIREBASE_API_KEY
    availability:
      - BUILD

  - variable: VITE_FIREBASE_AUTH_DOMAIN
    secret: VITE_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD

  - variable: VITE_FIREBASE_PROJECT_ID
    secret: VITE_FIREBASE_PROJECT_ID
    availability:
      - BUILD

  - variable: VITE_FIREBASE_APP_ID
    secret: VITE_FIREBASE_APP_ID
    availability:
      - BUILD

