runConfig:
  minInstances: 0
  maxInstances: 1
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: FIRESTORE_DATABASE_ID
    value: "(default)"
    availability:
      - RUNTIME

  - variable: CORS_ORIGINS
    value: "https://spring-fest--spring-fest-ksrce-cse.asia-southeast1.hosted.app,https://springfest2k26.live"
    availability:
      - RUNTIME

  # Emails granted admin on sign-in (comma-separated, case-insensitive).
  # Without this every login resolves as "participant" unless the person has
  # a doc in the Firestore `roles` collection. Never leave it empty — it's
  # the lockout-recovery path.
  - variable: ADMIN_EMAILS
    value: "anandhakumaran.m.s@gmail.com"
    availability:
      - RUNTIME

