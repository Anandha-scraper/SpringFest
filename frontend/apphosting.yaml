# Firebase App Hosting build/runtime config for the Spring Fest frontend
# (Vite/React SPA, served via `serve` — see package.json's "start" script).
# This file must live in this backend's root directory — fix it in the
# console (Backend > Settings > Root directory) to `frontend`; the CLI has
# no update command for an existing backend.
#
# All values below are read at BUILD time — Vite inlines import.meta.env.VITE_*
# into the static JS bundle when it builds, there's no server reading them at
# runtime for a plain SPA. None of these are secrets: VITE_FIREBASE_* values
# are public by design (they identify the project, they don't grant
# anything — see CLAUDE.md), and VITE_API_BASE is just a URL.

env:
  # Fill in once the backend's own App Hosting URL is known (or a custom
  # domain), e.g. https://spring-fest-api--spring-fest-ksrce-cse.<region>.hosted.app/api
  - variable: VITE_API_BASE
    value: "REPLACE_WITH_BACKEND_URL/api"
    availability:
      - BUILD

  - variable: VITE_FIREBASE_API_KEY
    value: "AIzaSyCT6U15MXjOCJeOZYk4NlEtcSU01WGwA6o"
    availability:
      - BUILD

  - variable: VITE_FIREBASE_AUTH_DOMAIN
    value: "spring-fest-ksrce-cse.firebaseapp.com"
    availability:
      - BUILD

  - variable: VITE_FIREBASE_PROJECT_ID
    value: "spring-fest-ksrce-cse"
    availability:
      - BUILD

  - variable: VITE_FIREBASE_APP_ID
    value: "1:4566914711:web:3ad4ea86f435881bcabbd2"
    availability:
      - BUILD
